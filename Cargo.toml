[package]
name = "joaju-unfurl"
version = "0.1.0"
edition = "2021"
description = "A fast and secure Rust library for OpenGraph metadata extraction with SSRF protection and visual card rendering"
license = "Apache-2.0"
repository = "https://codeberg.org/lumenpink/joaju-unfurl"
homepage = "https://codeberg.org/lumenpink/joaju-unfurl"
documentation = "https://docs.rs/joaju-unfurl"
readme = "README.md"
keywords = ["opengraph", "unfurl", "metadata", "scraper", "ssrf-protection"]
categories = ["web-programming", "network-programming", "command-line-utilities"]
authors = ["Lumen Pink <hi@lumen.pink>"]

[dependencies]
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
scraper = "0.22"
base64 = "0.22"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
tokio = { version = "1.38", features = ["full"] }
clap = { version = "4.5", features = ["derive"], optional = true }

[dev-dependencies]

[features]
default = ["cli"]
cli = ["dep:clap"]

[[bin]]
name = "joaju-unfurl"
path = "src/main.rs"
required-features = ["cli"]

[lib]
name = "joaju_unfurl"
path = "src/lib.rs"
